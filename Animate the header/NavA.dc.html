<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <header style="{{ headerStyle }}">
    <div style="max-width:1280px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="Accueil.dc.html" style="display:flex;align-items:center;position:relative;z-index:90"><img src="assets/logo-blanc.png" alt="Faceel-it" style="height:30px;width:auto;display:block" /></a>
      <div style="display:flex;align-items:center;gap:14px">
        <a href="mailto:contact@faceel-it.com" style="{{ ctaStyle }}" style-hover="transform:translateY(-2px);color:#0a0a1e">Prendre un café</a>
        <button type="button" onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ expanded }}" style="{{ burgerStyle }}" style-hover="border-color:#0bd904">
          <span style="{{ bar1 }}"></span>
          <span style="{{ bar2 }}"></span>
          <span style="{{ bar3 }}"></span>
        </button>
      </div>
    </div>
  </header>

  <nav aria-label="Menu principal" style="{{ overlayStyle }}">
    <div style="max-width:1280px;width:100%;margin:auto;padding:120px 32px 56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:56px">
      <div style="display:flex;flex-direction:column">
        <a href="Accueil.dc.html#expertises" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">Tech &amp; Data</a>
        <a href="Accueil.dc.html#ia" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">Discutons IA</a>
        <a href="Realisations.dc.html" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">Réalisations</a>
        <a href="Cas-Boulanger.dc.html" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">— Boulanger</a>
        <a href="Cas-Adeo.dc.html" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">— Adeo</a>
        <a href="Recrutement.dc.html" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">Nous rejoindre</a>
        <a href="Offres.dc.html" onClick="{{ closeMenu }}" style="{{ ovLink }}" style-hover="color:#0bd904;padding-left:12px">Consulter nos offres</a>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:26px">
        <div style="display:flex;flex-direction:column;gap:10px">
          <h5 style="margin:0;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:#0bd904;font-weight:600">À voir aussi</h5>
          <a href="Sport.dc.html" onClick="{{ closeMenu }}" style="color:rgba(244,243,238,.8);text-decoration:none;line-height:1.7" style-hover="color:#0bd904">Sport &amp; sponsoring</a>
          <a href="Insights.dc.html" onClick="{{ closeMenu }}" style="color:rgba(244,243,238,.8);text-decoration:none;line-height:1.7" style-hover="color:#0bd904">Insights</a>
          <a href="Contact.dc.html" onClick="{{ closeMenu }}" style="color:rgba(244,243,238,.8);text-decoration:none;line-height:1.7" style-hover="color:#0bd904">Agence &amp; contact</a>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h5 style="margin:0;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:#0bd904;font-weight:600">Contact</h5>
          <a href="mailto:contact@faceel-it.com" onClick="{{ closeMenu }}" style="color:rgba(244,243,238,.8);text-decoration:none;line-height:1.7" style-hover="color:#0bd904">contact@faceel-it.com</a>
          <span style="color:rgba(244,243,238,.6);line-height:1.6">10 allée du château blanc<br />59290 Wasquehal</span>
          <a href="https://www.linkedin.com/company/faceel-it" target="_blank" rel="noopener" style="color:rgba(244,243,238,.8);text-decoration:none;line-height:1.7" style-hover="color:#0bd904">LinkedIn</a>
        </div>
      </div>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;tech&quot;,&quot;realisations&quot;,&quot;recrutement&quot;,&quot;sport&quot;,&quot;insights&quot;,&quot;contact&quot;,&quot;ia&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, narrow: false, open: false };

  componentDidMount(){
    // scroll events are unreliable in embedded previews — use a sentinel
    this.sentinel = document.createElement("div");
    this.sentinel.style.cssText = "position:absolute;top:70px;left:0;width:1px;height:1px;pointer-events:none";
    document.body.appendChild(this.sentinel);
    if ("IntersectionObserver" in window) {
      this.io = new IntersectionObserver((entries) => {
        const s = !entries[0].isIntersecting;
        if (s !== this.state.scrolled) this.setState({ scrolled: s });
      }, { threshold: 0 });
      this.io.observe(this.sentinel);
    }
    this.onKey = (e) => { if (e.key === "Escape") this.closeMenu(); };
    window.addEventListener("keydown", this.onKey);
  }
  componentWillUnmount(){
    if (this.io) this.io.disconnect();
    if (this.sentinel && this.sentinel.parentNode) this.sentinel.parentNode.removeChild(this.sentinel);
    window.removeEventListener("keydown", this.onKey);
    document.body.style.overflow = "";
  }

  toggleMenu = () => {
    const open = !this.state.open;
    document.body.style.overflow = open ? "hidden" : "";
    this.setState({ open });
  };
  closeMenu = () => {
    document.body.style.overflow = "";
    this.setState({ open: false });
  };

  renderVals(){
    const st = this.state;
    const bar = "width:24px;height:2px;background:#f4f3ee;border-radius:2px;display:block;transition:.35s cubic-bezier(.2,.7,.2,1);";
    return {
      toggleMenu: this.toggleMenu,
      closeMenu: this.closeMenu,
      expanded: String(st.open),
      headerStyle: "position:fixed;top:0;left:0;right:0;z-index:85;font-family:'Poppins',sans-serif;"
        + "transition:background .35s,border-color .35s,backdrop-filter .35s;"
        + (st.scrolled && !st.open
          ? "background:rgba(10,10,30,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(244,243,238,.1);"
          : "background:transparent;border-bottom:1px solid rgba(244,243,238,0);"),
      ctaStyle: "display:inline-flex;font-size:.88rem;font-weight:600;color:#0a0a1e;background:#0bd904;border-radius:999px;padding:.62em 1.15em;"
        + "white-space:nowrap;text-decoration:none;position:relative;z-index:90;transition:transform .25s cubic-bezier(.2,.7,.2,1);",
      burgerStyle: "display:flex;width:50px;height:50px;border-radius:999px;border:1.5px solid rgba(244,243,238,.28);"
        + "background:transparent;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;"
        + "padding:0;position:relative;z-index:90;transition:border-color .3s cubic-bezier(.2,.7,.2,1);",
      bar1: bar + (st.open ? "transform:translateY(7px) rotate(45deg);" : ""),
      bar2: bar + (st.open ? "opacity:0;" : ""),
      bar3: bar + (st.open ? "transform:translateY(-7px) rotate(-45deg);" : ""),
      overlayStyle: "position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#000066,#04041f);color:#f4f3ee;"
        + "display:flex;flex-direction:column;overflow-y:auto;font-family:'Poppins',sans-serif;"
        + "transition:opacity .45s cubic-bezier(.2,.7,.2,1),visibility .45s;"
        + (st.open ? "opacity:1;visibility:visible;pointer-events:auto;" : "opacity:0;visibility:hidden;pointer-events:none;"),
      ovLink: "display:block;padding:18px 0;border-bottom:1px solid rgba(244,243,238,.14);text-decoration:none;"
        + "font-weight:700;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:-.025em;color:#f4f3ee;"
        + "transition:color .28s,padding-left .28s cubic-bezier(.2,.7,.2,1);"
    };
  }
}
</script>
</body>
</html>
