<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div aria-hidden="true" style="display:none">
    <svg xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"></path><path d="M16 5.3a3 3 0 0 1 0 5.4"></path><path d="M17.6 14.7c2 .6 3.4 2.5 3.4 5.3"></path></symbol>
      <symbol id="i-growth" viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="M7 15l4-4 3 3 5-6"></path><path d="M15 8h4v4"></path></symbol>
      <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M5 14c-1.6 1.6-2 5.5-2 5.5s3.9-.4 5.5-2"></path><path d="M14 4c3.3 0 6 2.7 6 6-2 4.3-6.5 7.5-9.5 8.5L7 15c1-3 4.2-9 7-11z"></path><circle cx="14.5" cy="9.5" r="1.6"></circle></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5"></path><path d="M16 7l5 5-5 5"></path><path d="M13.5 5l-3 14"></path></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 13l9 5 9-5"></path></symbol>
      <symbol id="i-data" viewBox="0 0 24 24"><path d="M5 20v-6"></path><path d="M10 20V5"></path><path d="M15 20v-9"></path><path d="M3 20h18"></path></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-14 0 10-6 15-13 15"></path><path d="M4.5 19.5c3-5 7-8 11-9"></path></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15.5H5.5C4.7 19.5 4 18.8 4 18V5.5z"></path><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15.5h5.5c.8 0 1.5-.7 1.5-1.5V5.5z"></path></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 9.5h16"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20S4 14.5 4 9.3A3.8 3.8 0 0 1 12 6a3.8 3.8 0 0 1 8 3.3C20 14.5 12 20 12 20z"></path></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.5l1-5.8-4.3-4.1 5.9-.8L12 3.5z"></path></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"></path></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.6 2.5L16 9.5"></path></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L18 9.5l-4.2 1.6L12 16l-1.8-4.9L6 9.5l4.2-1.6L12 3z"></path><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"></path></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.3-4.3"></path></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1 5.1-2.1z"></path></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 .3-8A5 5 0 0 1 17 9.4 3.6 3.6 0 0 1 18 18H7z"></path></symbol>
      <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.5v2.5M12 18v2.5M4.6 7.5l2.2 1.3M17.2 15.2l2.2 1.3M19.4 7.5l-2.2 1.3M6.8 15.2l-2.2 1.3"></path></symbol>
      <symbol id="i-handshake" viewBox="0 0 24 24"><path d="M8 13l3 3 2-2 3 3"></path><path d="M3 8l4-3 5 3 5-3 4 3"></path><path d="M7 5v6M17 5v8"></path></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.8 10.7c.6.6.8 1.1.8 2.3h6c0-1.2.2-1.7.8-2.3A6 6 0 0 0 12 3z"></path></symbol>
    </svg>
  </div>

  <header style="{{ headerStyle }}">
    <div style="max-width:1200px;width:100%;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="Accueil.dc.html" style="display:flex;align-items:center"><img src="assets/logo-blanc.png" alt="Faceel-it" style="height:38px;width:auto;display:block" /></a>
      <div style="display:flex;align-items:center;gap:16px">
        <a href="mailto:contact@faceel-it.com" style="color:rgba(255,255,255,.85);font-weight:500;font-size:.95rem;text-decoration:none" style-hover="color:#3de85c">contact@faceel-it.com</a>
        <button type="button" onClick="{{ toggleMenu }}" aria-label="Ouvrir le menu" style="width:54px;height:54px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0;position:relative;z-index:90;transition:border-color .3s cubic-bezier(.2,.7,.2,1)" style-hover="border-color:#0bd904">
          <span style="{{ bar1 }}"></span>
          <span style="{{ bar2 }}"></span>
          <span style="{{ bar3 }}"></span>
        </button>
      </div>
    </div>
  </header>

  <nav aria-label="Menu principal" style="{{ overlayStyle }}">
    <div style="max-width:1200px;width:100%;margin:auto;padding:130px 28px 50px;display:grid;grid-template-columns:1.3fr .7fr;gap:60px">
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
          <div style="border-bottom:1px solid rgba(255,255,255,.14)">
            <a href="{{ item.href }}" onClick="{{ item.onClick }}" style="{{ item.linkStyle }}" style-hover="color:#0bd904;padding-left:14px">
              {{ item.label }}
              <span style="{{ item.caretStyle }}">{{ item.caret }}</span>
            </a>
            <div style="{{ item.subStyle }}">
              <sc-for list="{{ item.subs }}" as="sub" hint-placeholder-count="0">
                <a href="{{ sub.href }}" style="color:rgba(255,255,255,.7);font-size:1.02rem;font-weight:500;padding:9px 0;display:flex;align-items:center;gap:.6em;text-decoration:none;transition:color .25s,padding-left .25s" style-hover="color:#3de85c;padding-left:6px">
                  <span style="width:6px;height:6px;border-radius:50%;background:#0bd904;opacity:.6;flex:0 0 auto"></span>
                  {{ sub.label }}
                </a>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <aside style="border-left:1px solid rgba(255,255,255,.14);padding-left:44px;display:flex;flex-direction:column;justify-content:center;gap:28px">
        <div>
          <h5 style="font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;color:#3de85c;margin:0 0 12px;font-weight:600">Contact</h5>
          <a href="mailto:contact@faceel-it.com" style="color:rgba(255,255,255,.82);line-height:1.7;display:block;text-decoration:none" style-hover="color:#3de85c">contact@faceel-it.com</a>
          <p style="color:rgba(255,255,255,.82);line-height:1.65;margin:6px 0 0">10 allée du château blanc<br />59290 Wasquehal</p>
        </div>
        <div>
          <h5 style="font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;color:#3de85c;margin:0 0 12px;font-weight:600">Suivez-nous</h5>
          <a href="https://www.linkedin.com/company/faceel-it" target="_blank" rel="noopener" style="color:rgba(255,255,255,.82);line-height:1.7;display:block;text-decoration:none" style-hover="color:#3de85c">LinkedIn — @faceel-it</a>
        </div>
        <a href="mailto:contact@faceel-it.com" style="display:inline-flex;align-items:center;gap:.6em;font-weight:600;font-size:.94rem;padding:.72em 1.35em;border-radius:999px;background:#0bd904;color:#000066;text-decoration:none;align-self:flex-start;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s" style-hover="transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(11,217,4,.6)">Nous contacter <span>&rarr;</span></a>
      </aside>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:220},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Accueil&quot;,&quot;Expertises&quot;,&quot;Le collectif&quot;,&quot;Carrières&quot;],&quot;default&quot;:&quot;Accueil&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;solid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false, scrolled: false, sub: null };

  componentDidMount(){
    this.onScroll = () => {
      var s = window.scrollY > 40;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    this.onScroll();
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onKey = (e) => { if (e.key === "Escape") this.close(); };
    window.addEventListener("keydown", this.onKey);
  }
  componentWillUnmount(){
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("keydown", this.onKey);
    document.body.style.overflow = "";
  }

  close = () => {
    document.body.style.overflow = "";
    this.setState({ open: false, sub: null });
  };
  toggleMenu = () => {
    var open = !this.state.open;
    document.body.style.overflow = open ? "hidden" : "";
    this.setState({ open: open, sub: null });
  };

  NAV = [
    { label: "Accueil", href: "Accueil.dc.html" },
    { label: "Expertises", href: "Expertises.dc.html", subs: [
      { label: "Vue d'ensemble", href: "Expertises.dc.html" },
      { label: "Data & IA", href: "Data-IA.dc.html" },
      { label: "Notre stack technique", href: "Expertises.dc.html#stack" },
      { label: "Notre méthode", href: "Expertises.dc.html#methode" }
    ] },
    { label: "Le collectif", href: "Collectif.dc.html", subs: [
      { label: "Notre histoire", href: "Collectif.dc.html#histoire" },
      { label: "L'équipe & les fondateurs", href: "Collectif.dc.html#equipe" },
      { label: "Engagements & RSE", href: "Collectif.dc.html#rse" },
      { label: "Sport & vie d'équipe", href: "Collectif.dc.html#sport" }
    ] },
    { label: "Carrières", href: "Carrieres.dc.html", subs: [
      { label: "Pourquoi nous rejoindre", href: "Carrieres.dc.html#pourquoi" },
      { label: "Nos offres", href: "Carrieres.dc.html#offres" },
      { label: "Notre process", href: "Carrieres.dc.html#process" }
    ] },
    { label: "Contact", href: "mailto:contact@faceel-it.com" }
  ];

  renderVals(){
    var st = this.state, self = this;
    var active = this.props.active || "";
    var bar = "width:22px;height:2px;background:#fff;border-radius:2px;display:block;transition:.35s cubic-bezier(.2,.7,.2,1);";
    var solid = this.props.solid ?? false;
    var scrolled = st.scrolled || solid;

    return {
      toggleMenu: this.toggleMenu,
      headerStyle: "position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:center;"
        + "transition:background .4s cubic-bezier(.2,.7,.2,1),backdrop-filter .4s,box-shadow .4s;"
        + (scrolled && !st.open
          ? "background:rgba(4,4,31,.82);backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.14);"
          : "background:transparent;"),
      bar1: bar + (st.open ? "transform:translateY(7px) rotate(45deg);" : ""),
      bar2: bar + (st.open ? "opacity:0;" : ""),
      bar3: bar + (st.open ? "transform:translateY(-7px) rotate(-45deg);" : ""),
      overlayStyle: "position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#000066,#04041f);color:#fff;"
        + "display:flex;flex-direction:column;overflow-y:auto;"
        + "transition:opacity .5s cubic-bezier(.2,.7,.2,1),visibility .5s;"
        + (st.open ? "opacity:1;visibility:visible;pointer-events:auto;" : "opacity:0;visibility:hidden;pointer-events:none;"),
      items: this.NAV.map(function(it, i){
        var hasSubs = !!(it.subs && it.subs.length);
        var open = st.sub === i;
        return {
          label: it.label,
          href: hasSubs ? it.href : it.href,
          caret: hasSubs ? "\u25BE" : "",
          onClick: hasSubs
            ? function(e){ e.preventDefault(); self.setState({ sub: open ? null : i }); }
            : function(){ self.close(); },
          linkStyle: "display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;text-decoration:none;"
            + "font-weight:700;font-size:clamp(1.7rem,3.8vw,2.7rem);letter-spacing:-.02em;cursor:pointer;"
            + "transition:color .3s,padding-left .3s cubic-bezier(.2,.7,.2,1);"
            + "color:" + (active === it.label ? "#3de85c" : "#fff") + ";",
          caretStyle: "color:#0bd904;font-size:1.1rem;transition:transform .35s cubic-bezier(.2,.7,.2,1);"
            + (open ? "transform:rotate(180deg);" : ""),
          subStyle: "display:grid;grid-template-columns:repeat(2,1fr);gap:2px 30px;overflow:hidden;"
            + "transition:max-height .45s cubic-bezier(.2,.7,.2,1),padding .45s,opacity .45s;"
            + (open ? "max-height:320px;padding-bottom:20px;opacity:1;" : "max-height:0;opacity:0;"),
          subs: (it.subs || []).map(function(s){ return { label: s.label, href: s.href }; })
        };
      })
    };
  }
}
</script>
</body>
</html>
