server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Posés ici pour couvrir toute réponse qui ne passerait par aucun bloc
    # `location` ci-dessous (page d'erreur générée par Nginx lui-même). Ne PAS
    # compter sur l'héritage vers les blocs `location` : chacun d'eux qui
    # déclare son propre `add_header` (Cache-Control) annule cet héritage et
    # doit donc réinclure ce fichier explicitement - voir security-headers.conf.
    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Filet de sécurité : le worker de mock ne doit jamais atteindre le
    # domaine public. `vite.config.ts` le retire déjà du build de production
    # (`stripMockWorkerFromBuild`) - ce bloc couvre le cas où il
    # réapparaîtrait malgré tout (régression du plugin, build hors pipeline
    # standard). Défense en profondeur, pas la protection principale.
    location = /mockServiceWorker.js {
        return 404;
    }

    # Les assets sont hashés par Vite : cache agressif sans risque.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit JAMAIS être mis en cache, sinon les clients
    # continuent de charger les anciens hash d'assets après déploiement.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Relais vers l'API : le navigateur ne voit qu'une seule origine,
    # donc aucun préflight CORS en production.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
#         proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA : toute route inconnue rend index.html et c'est
    # vue-router qui tranche (y compris la 404).
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
