# En-têtes de sécurité HTTP, mutualisés par `include` plutôt que dupliqués.
#
# `add_header` ne s'hérite JAMAIS d'un niveau parent dès qu'un bloc en
# déclare un seul à son propre niveau (règle nginx, pas une supposition) :
# `location /assets/` et `location = /index.html` déclarent déjà leur propre
# `Cache-Control`, ce qui suffit à annuler l'héritage des en-têtes posés au
# niveau `server`. Ce fichier est donc inclus explicitement dans CHAQUE bloc
# qui répond (`server`, `/assets/`, `= /index.html`, `/api/`, `/`) plutôt que
# posé une seule fois en espérant qu'il se propage.
#
# `always` : ces en-têtes doivent apparaître même sur les réponses d'erreur
# (4xx/5xx), pas seulement sur les 200 - un 404 sans ces en-têtes reste une
# réponse exploitable par un navigateur.

# CSP : pas de source externe aujourd'hui (polices et images sont servies
# depuis ce domaine, aucun CDN tiers) - la politique reste donc étroite.
# `style-src` inclut 'unsafe-inline' : `AnimatedBackground.vue` et d'autres
# composants du design system posent des styles dynamiques via `:style`
# (position, taille, délai d'animation calculés) - un `style-src` strict sans
# 'unsafe-inline' bloquerait ces styles au niveau du navigateur (la
# restriction CSP sur `style-src` couvre aussi les styles posés par le DOM
# via JavaScript, pas seulement les blocs <style> écrits en dur). Passer à un
# CSP basé sur des nonces exigerait un rendu par gabarit côté serveur pour
# injecter un nonce par requête - hors de portée d'un simple fichier statique
# servi par Nginx tel qu'il est déployé aujourd'hui.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Complète `frame-ancestors` ci-dessus pour les navigateurs qui ne
# supportent que l'ancien en-tête dédié au clickjacking.
add_header X-Frame-Options "DENY" always;

# Empêche le navigateur de réinterpréter un fichier selon un type détecté
# plutôt que le `Content-Type` déclaré (vecteur classique de XSS par upload
# ou par réponse mal typée).
add_header X-Content-Type-Options "nosniff" always;

# HSTS. Sans effet tant que ce Nginx est servi en HTTP simple (validation
# locale, `docker compose --profile full`) : un navigateur n'applique et ne
# met en cache cet en-tête que reçu sur une connexion HTTPS. Il s'active de
# lui-même dès que ce service passe derrière une terminaison TLS réelle, sans
# modification supplémentaire. `preload` est volontairement omis : la
# soumission au préchargement HSTS des navigateurs est quasi irréversible à
# l'échelle d'un domaine, ce n'est pas une décision à prendre depuis un
# fichier de configuration Nginx.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# Deux en-têtes complémentaires, à faible risque de compatibilité, ajoutés
# dans le même mouvement : ils réduisent la surface sans contrainte connue
# sur ce site (aucune fonctionnalité du site n'utilise la géolocalisation,
# la caméra ou le micro ; aucun lien externe ne dépend d'un referrer complet).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
