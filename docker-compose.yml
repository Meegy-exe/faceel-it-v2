services:
  db:
    image: postgres:16-alpine
    container_name: faceelit-db
    environment:
      POSTGRES_DB: faceelit
      POSTGRES_USER: faceelit
      POSTGRES_PASSWORD: faceelit

    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U faceelit -d faceelit" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    container_name: faceelit-mail


  server:
    build:
      context: ./server
    container_name: faceelit-server
    profiles: [ "full" ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/faceelit
      DATABASE_USER: faceelit
      DATABASE_PASSWORD: faceelit
      MAIL_HOST: mail
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      # hébergé temporairement
      FACEEL_CORS_ORIGINS: http://localhost:5173,http://localhost:8081


  client:
    build:
      context: ./client
    container_name: faceelit-client
    profiles: [ "full" ]
    depends_on:
      - server


  ngrok:
    image: ngrok/ngrok:latest
    container_name: faceelit-ngrok
    profiles: [ "full" ]
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "client:80"


volumes:
  db-data: